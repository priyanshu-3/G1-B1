<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0c" />
    <script>
      // Apply the saved or system theme before first paint so there is no flash.
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem("theme")
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"
        }
        document.documentElement.classList.toggle("dark", theme === "dark")
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#0d0d0c" : "#f5f3ec"
      })()
    </script>
    <meta
      name="description"
      content="Jatin Bisht — Full-Stack Software Engineer in Mumbai. Python, FastAPI, React, Next.js, Docker, Azure & GCP."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Jatin Bisht — Full-Stack Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
